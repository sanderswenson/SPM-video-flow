name: Windows app

# Every push builds and smoke-tests the installer (downloadable from the run's artifacts).
# Pushing a tag vX.Y.Z (matching vflow/__init__.py) also publishes a GitHub Release, which
# installed apps pick up as an auto-update.
#
# Release channel: set the repo variable RELEASE_REPO (e.g. "you/vflow-releases") plus a
# RELEASES_TOKEN secret with contents:write on that repo. Needed while this repo is private,
# because apps can't read a private repo's releases without credentials.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  FFMPEG_VERSION: "7.1"
  RELEASE_REPO: ${{ vars.RELEASE_REPO || github.repository }}

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pyinstaller==6.22.3

      - name: Unit tests
        run: pytest -q

      - name: Check tag matches version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $ver = python -c "import vflow; print(vflow.__version__)"
          if ("v$ver" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match vflow.__version__ $ver" }

      - name: Fetch ffmpeg
        shell: pwsh
        run: |
          $v = $env:FFMPEG_VERSION
          Invoke-WebRequest "https://github.com/GyanD/codexffmpeg/releases/download/$v/ffmpeg-$v-essentials_build.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffx
          New-Item -ItemType Directory packaging/ffmpeg -Force | Out-Null
          $dir = Get-ChildItem ffx -Directory | Select-Object -First 1
          Copy-Item "$($dir.FullName)/bin/ffmpeg.exe", "$($dir.FullName)/bin/ffprobe.exe" packaging/ffmpeg/
          Copy-Item "$($dir.FullName)/LICENSE" packaging/ffmpeg/LICENSE.txt -ErrorAction SilentlyContinue
          $filters = & packaging/ffmpeg/ffmpeg.exe -hide_banner -filters
          if (-not ($filters | Select-String " ass ")) { throw "this ffmpeg build lacks libass (caption burn-in)" }

      - name: Bake release channel into the build
        shell: pwsh
        run: |
          "UPDATE_REPO = `"$env:RELEASE_REPO`"" | Out-File -Encoding utf8 vflow/_build.py
          Get-Content vflow/_build.py

      - name: Build app (PyInstaller)
        run: pyinstaller packaging/vflow.spec --noconfirm --distpath dist --workpath build

      - name: Make a speech sample
        shell: powershell
        run: ./packaging/make_sample.ps1

      - name: Smoke test the packaged app (real Whisper transcription, full render)
        shell: pwsh
        run: |
          $p = Start-Process dist/vflow/vflow.exe -ArgumentList "--selftest", "$PWD/selftest.log", "--selftest-video", "$PWD/sample.mp4" -Wait -PassThru
          Get-Content selftest.log
          if ($p.ExitCode -ne 0) { throw "selftest failed with exit code $($p.ExitCode)" }

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress | Out-Null
          }
          $ver = python -c "import vflow; print(vflow.__version__)"
          & $iscc /Qp "/DAppVersion=$ver" packaging/installer.iss
          if ($LASTEXITCODE -ne 0) { throw "iscc failed" }
          Get-ChildItem dist/*-setup.exe

      - name: Test the installer (silent install, relaunch, uninstall)
        shell: pwsh
        run: |
          $setup = (Get-ChildItem dist/*-setup.exe).FullName
          # WaitForExit waits for the installer only. (-Wait would also wait for the app it launches.)
          $p = Start-Process $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -PassThru
          if (-not $p.WaitForExit(300000)) { throw "installer timed out" }
          if ($p.ExitCode -ne 0) { throw "installer exit code $($p.ExitCode)" }
          $exe = "$env:LOCALAPPDATA\Programs\vflow\vflow.exe"
          if (-not (Test-Path $exe)) { throw "vflow.exe not installed" }
          # The installer relaunches the app (as a self-update would); it should stay up.
          Start-Sleep 8
          $running = Get-Process vflow -ErrorAction SilentlyContinue
          if (-not $running) { throw "app did not stay running after install"; }
          Write-Output "app running after install (pid $($running.Id -join ','))"
          $running | Stop-Process -Force
          Start-Sleep 2
          $un = "$env:LOCALAPPDATA\Programs\vflow\unins000.exe"
          $u = Start-Process $un -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES" -PassThru
          if (-not $u.WaitForExit(120000)) { throw "uninstaller timed out" }
          # The uninstaller finishes removal from a temp copy of itself, so poll briefly.
          for ($i = 0; $i -lt 20 -and (Test-Path $exe); $i++) { Start-Sleep 1 }
          if (Test-Path $exe) { throw "uninstall left vflow.exe behind" }
          Write-Output "install / relaunch / uninstall ok"

      - uses: actions/upload-artifact@v4
        with:
          name: vflow-windows-setup
          path: dist/*-setup.exe
          retention-days: 14

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN || github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $prev = git describe --tags --abbrev=0 "$tag^" 2>$null
          $range = if ($prev) { "$prev..$tag" } else { $tag }
          git log --pretty="- %s" $range | Out-File -Encoding utf8 notes.md
          gh release create $tag (Get-ChildItem dist/*-setup.exe).FullName `
            --repo $env:RELEASE_REPO --title "vflow $tag" --notes-file notes.md
