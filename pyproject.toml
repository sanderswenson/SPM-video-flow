[project]
name = "vflow"
dynamic = ["version"]
description = "Turn raw, uncut talking-head footage into postable short-form video."
requires-python = ">=3.10"
dependencies = [
    "faster-whisper>=1.1",
    "anthropic>=1.15",
    "pydantic>=2",
    "pywebview>=5",
    "keyring>=25",
    "numpy",
    "opencv-python-headless>=4.8,<5",  # 5.x no longer bundles the Haar cascades used for framing
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
vflow = "vflow.cli:main"

[project.gui-scripts]
vflow-app = "vflow.app.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["vflow", "vflow.app"]

[tool.setuptools.package-data]
vflow = ["fonts/*"]
"vflow.app" = ["static/*"]

[tool.setuptools.dynamic]
version = {attr = "vflow.__version__"}
